<form class="mt-5 grid gap-4 rounded-2xl border border-border bg-surface-muted p-4" (ngSubmit)="submitUpload()">
  <label class="grid gap-2 text-sm font-bold text-text-muted">
    <span>Upload behavior</span>
    <select
      class="w-full rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft"
      name="uploadMode"
      [(ngModel)]="uploadMode"
    >
      <option value="automatic">Automatically detect a new version</option>
      <option value="new_document">Always create a new document</option>
      <option value="manual_version">Add a version to an existing document</option>
    </select>
    <small class="font-medium leading-relaxed text-text-muted">
      Automatic detection recognizes exact names and trailing markers such as Draft5, v5, version 5, or revision 5. Shared title and publication-date values apply to every selected file.
    </small>
  </label>

  <label class="grid gap-2 text-sm font-bold text-text-muted" *ngIf="uploadMode === 'manual_version'">
    <span>Existing document</span>
    <select
      class="w-full rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft"
      name="versionOfDocumentId"
      [(ngModel)]="versionOfDocumentId"
      required
    >
      <option value="" disabled>Select the logical document</option>
      <option *ngFor="let document of documents" [value]="document.id">
        {{ document.title }} · {{ document.original_filename || 'unnamed file' }}
      </option>
    </select>
  </label>

  <label class="grid gap-2 text-sm font-bold text-text-muted">
    <span>Optional title</span>
    <input
      class="w-full rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft"
      type="text"
      name="documentTitle"
      [(ngModel)]="title"
      [disabled]="selectedFiles().length > 1"
      [placeholder]="selectedFiles().length > 1 ? 'Titles are derived from filenames for batch uploads' : 'e.g. Architecture notes'"
    />
  </label>

  <label class="grid gap-2 text-sm font-bold text-text-muted">
    <span>Optional publication date</span>
    <input
      class="w-full rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft"
      type="date"
      name="publishedAt"
      [(ngModel)]="publishedAt"
    />
    <small class="font-medium leading-relaxed text-text-muted">
      Leave blank when the source has no known publication date. Upload time is recorded automatically.
    </small>
  </label>

  <label class="grid gap-2 text-sm font-bold text-text-muted">
    <span>Source files</span>
    <input
      class="w-full rounded-xl border border-border bg-surface p-2.5 text-text outline-none transition file:mr-3 file:rounded-full file:border-0 file:bg-primary-soft file:px-3 file:py-1.5 file:font-bold file:text-primary focus:border-primary focus:ring-4 focus:ring-primary-soft"
      type="file"
      multiple
      accept=".pdf,.txt,.md,text/plain,text/markdown,application/pdf"
      (change)="onFilesSelected($event)"
    />
    <strong class="truncate text-sm font-bold text-text">{{ selectedFiles().length ? selectedFiles().length + ' file(s) selected' : 'Choose one or more PDF, text, or markdown files' }}</strong>
  </label>

  <button
    class="inline-flex min-h-11 items-center justify-center rounded-full bg-primary px-5 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-primary-strong disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
    type="submit"
    [disabled]="selectedFiles().length === 0 || uploading || (uploadMode === 'manual_version' && !versionOfDocumentId)"
  >
    {{ uploading ? 'Uploading…' : selectedFiles().length > 1 ? 'Upload ' + selectedFiles().length + ' files' : uploadMode === 'manual_version' ? 'Upload new version' : 'Upload document' }}
  </button>

  <p class="m-0 font-bold text-danger" *ngIf="error">{{ error }}</p>
</form>
