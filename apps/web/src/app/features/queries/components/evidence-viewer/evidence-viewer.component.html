<section class="mt-1.5 grid gap-3" *ngIf="evidence.length > 0">
  <div class="flex items-center justify-between gap-4">
    <h4 class="m-0 text-base font-extrabold tracking-tight">Evidence</h4>
    <span class="rounded-full bg-primary-soft px-3 py-1.5 text-xs font-extrabold text-primary">{{ evidence.length }}</span>
  </div>
  <details class="rounded-2xl border border-border bg-surface-muted p-4" *ngFor="let item of evidence; trackBy: trackEvidence">
    <summary class="flex cursor-pointer flex-wrap gap-2.5 font-extrabold">
      <strong>#{{ item.rank }}</strong>
      <span>{{ evidenceSource(item) }}</span>
      <em *ngIf="item.score !== null">score {{ item.score | number: '1.3-4' }}</em>
    </summary>
    <p class="mt-3 leading-relaxed text-text">{{ item.text }}</p>
    <pre class="mt-3 max-h-56 overflow-auto rounded-xl bg-slate-950 p-3 text-xs text-slate-100">{{ item.metadata | json }}</pre>
  </details>
</section>
