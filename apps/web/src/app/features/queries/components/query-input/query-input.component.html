<form class="mt-5 grid gap-4" (ngSubmit)="submitQuestion()">
  <label class="grid gap-2 text-sm font-bold text-text-muted">
    <span>Question</span>
    <textarea
      class="min-h-36 w-full resize-y rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft"
      name="question"
      [(ngModel)]="question"
      rows="5"
      placeholder="Ask something that should be answered from the uploaded documents…"
      required
    ></textarea>
  </label>

  <div class="grid grid-cols-[minmax(220px,1fr)_160px_auto] items-end gap-4 max-md:grid-cols-1">
    <label class="grid gap-2 text-sm font-bold text-text-muted">
      <span>Retrieval pipeline</span>
      <select
        class="w-full rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft disabled:cursor-not-allowed disabled:opacity-60"
        name="pipelineName"
        [(ngModel)]="pipelineName"
        [disabled]="pipelinesLoading || pipelines.length === 0"
      >
        <option *ngFor="let pipeline of pipelines; trackBy: pipelineTrackBy" [value]="pipeline.name">
          {{ pipeline.name }} · {{ pipeline.version }}{{ pipeline.is_default ? ' (default)' : '' }}
        </option>
      </select>
      <small class="font-medium text-text-muted" *ngIf="pipelinesLoading">Loading registered pipelines…</small>
      <small class="font-semibold text-danger" *ngIf="pipelinesError">{{ pipelinesError }}</small>
    </label>

    <label class="grid gap-2 text-sm font-bold text-text-muted">
      <span>Top-k chunks</span>
      <input
        class="w-full rounded-xl border border-border bg-surface px-3.5 py-3 text-text outline-none transition focus:border-primary focus:ring-4 focus:ring-primary-soft"
        type="number"
        name="topK"
        [(ngModel)]="topK"
        min="1"
        max="25"
      />
    </label>

    <button
      class="inline-flex min-h-11 items-center justify-center rounded-full bg-primary px-5 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-primary-strong disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
      type="submit"
      [disabled]="question.trim().length === 0 || running"
    >
      {{ running ? 'Running query…' : 'Ask question' }}
    </button>
  </div>

  <p class="m-0 font-bold text-danger" *ngIf="error">{{ error }}</p>
</form>
