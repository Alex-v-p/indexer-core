services:
  bootstrap:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: indexer-core-api:${IMAGE_TAG:-local}
    command: ["python", "-m", "scripts.bootstrap_database"]
    environment:
      APP_NAME: ${APP_NAME:-Indexer Core API}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-indexer}:${POSTGRES_PASSWORD:-indexer_password}@db:5432/${POSTGRES_DB:-indexer}
      BOOTSTRAP_DB_MAX_ATTEMPTS: ${BOOTSTRAP_DB_MAX_ATTEMPTS:-30}
      BOOTSTRAP_DB_RETRY_SECONDS: ${BOOTSTRAP_DB_RETRY_SECONDS:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  cross-encoder-bootstrap:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: indexer-core-api:${IMAGE_TAG:-local}
    command: ["python", "-m", "scripts.download_cross_encoder"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      CROSS_ENCODER_MODEL_REVISION: ${CROSS_ENCODER_MODEL_REVISION:-c5ee24cb16019beea0893ab7796b1df96625c6b8}
      CROSS_ENCODER_MODEL_PATH: ${CROSS_ENCODER_MODEL_PATH:-/root/.cache/huggingface/indexer/cross-encoder}
      CROSS_ENCODER_DOWNLOAD_FORCE: ${CROSS_ENCODER_DOWNLOAD_FORCE:-false}
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - cross_encoder_cache:/root/.cache/huggingface
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: indexer-core-api:${IMAGE_TAG:-local}
    environment:
      APP_NAME: ${APP_NAME:-Indexer Core API}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DEFAULT_QUERY_PIPELINE: ${DEFAULT_QUERY_PIPELINE:-agentic_rag}
      QUERY_CLASSIFICATION_FAIL_OPEN: ${QUERY_CLASSIFICATION_FAIL_OPEN:-true}
      QUERY_CLASSIFICATION_MAX_RATIONALE_CHARS: ${QUERY_CLASSIFICATION_MAX_RATIONALE_CHARS:-500}
      RETRIEVAL_PLANNING_LOW_CONFIDENCE_THRESHOLD: ${RETRIEVAL_PLANNING_LOW_CONFIDENCE_THRESHOLD:-0.55}
      INFORMATION_NEED_DECOMPOSITION_FAIL_OPEN: ${INFORMATION_NEED_DECOMPOSITION_FAIL_OPEN:-true}
      INFORMATION_NEED_MAX_COUNT: ${INFORMATION_NEED_MAX_COUNT:-6}
      INFORMATION_NEED_MAX_CHARS: ${INFORMATION_NEED_MAX_CHARS:-240}
      INFORMATION_NEED_DECOMPOSITION_MAX_RATIONALE_CHARS: ${INFORMATION_NEED_DECOMPOSITION_MAX_RATIONALE_CHARS:-500}
      EVIDENCE_GRADING_FAIL_OPEN: ${EVIDENCE_GRADING_FAIL_OPEN:-true}
      EVIDENCE_GRADING_RELEVANCE_THRESHOLD: ${EVIDENCE_GRADING_RELEVANCE_THRESHOLD:-0.60}
      EVIDENCE_GRADING_INFORMATION_NEED_SUPPORT_THRESHOLD: ${EVIDENCE_GRADING_INFORMATION_NEED_SUPPORT_THRESHOLD:-0.75}
      EVIDENCE_GRADING_MAX_CHARS_PER_EVIDENCE: ${EVIDENCE_GRADING_MAX_CHARS_PER_EVIDENCE:-2000}
      EVIDENCE_GRADING_MAX_RATIONALE_CHARS: ${EVIDENCE_GRADING_MAX_RATIONALE_CHARS:-500}
      EVIDENCE_ARBITRATION_FAIL_OPEN: ${EVIDENCE_ARBITRATION_FAIL_OPEN:-true}
      EVIDENCE_ARBITRATION_RELEVANCE_THRESHOLD: ${EVIDENCE_ARBITRATION_RELEVANCE_THRESHOLD:-0.70}
      EVIDENCE_ARBITRATION_INFORMATION_NEED_SUPPORT_THRESHOLD: ${EVIDENCE_ARBITRATION_INFORMATION_NEED_SUPPORT_THRESHOLD:-0.80}
      EVIDENCE_ARBITRATION_MAX_CHARS_PER_EVIDENCE: ${EVIDENCE_ARBITRATION_MAX_CHARS_PER_EVIDENCE:-1800}
      EVIDENCE_ARBITRATION_MAX_RATIONALE_CHARS: ${EVIDENCE_ARBITRATION_MAX_RATIONALE_CHARS:-500}
      PRIMARY_DOCUMENT_DETECTION_ENABLED: ${PRIMARY_DOCUMENT_DETECTION_ENABLED:-true}
      PRIMARY_DOCUMENT_DETECTION_MIN_SCORE: ${PRIMARY_DOCUMENT_DETECTION_MIN_SCORE:-0.65}
      PRIMARY_DOCUMENT_DETECTION_MIN_MARGIN: ${PRIMARY_DOCUMENT_DETECTION_MIN_MARGIN:-0.08}
      PRIMARY_DOCUMENT_DETECTION_REPLACEMENT_MARGIN: ${PRIMARY_DOCUMENT_DETECTION_REPLACEMENT_MARGIN:-0.12}
      DOCUMENT_BALANCING_ENABLED: ${DOCUMENT_BALANCING_ENABLED:-true}
      DOCUMENT_BALANCING_CANDIDATE_MULTIPLIER: ${DOCUMENT_BALANCING_CANDIDATE_MULTIPLIER:-3}
      DOCUMENT_BALANCING_MAX_CANDIDATES: ${DOCUMENT_BALANCING_MAX_CANDIDATES:-60}
      DOCUMENT_BALANCING_PRIMARY_MIN_SHARE: ${DOCUMENT_BALANCING_PRIMARY_MIN_SHARE:-0.60}
      DOCUMENT_BALANCING_PRIMARY_MAX_SHARE: ${DOCUMENT_BALANCING_PRIMARY_MAX_SHARE:-0.80}
      DOCUMENT_BALANCING_SECONDARY_MAX_SHARE: ${DOCUMENT_BALANCING_SECONDARY_MAX_SHARE:-0.40}
      DOCUMENT_BALANCING_UNPREFERRED_MAX_SHARE: ${DOCUMENT_BALANCING_UNPREFERRED_MAX_SHARE:-0.60}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-indexer}:${POSTGRES_PASSWORD:-indexer_password}@db:5432/${POSTGRES_DB:-indexer}
      BOOTSTRAP_DB_MAX_ATTEMPTS: ${BOOTSTRAP_DB_MAX_ATTEMPTS:-30}
      BOOTSTRAP_DB_RETRY_SECONDS: ${BOOTSTRAP_DB_RETRY_SECONDS:-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_RERANK_MODEL: ${OLLAMA_RERANK_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      DOCUMENT_STORAGE_BACKEND: ${DOCUMENT_STORAGE_BACKEND:-minio}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-/app/storage/documents}
      DOCUMENT_STAGING_DIR: ${DOCUMENT_STAGING_DIR:-/tmp/indexer-ingestion}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-250}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-indexer}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-indexer_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-indexer-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_OBJECT_PREFIX: ${MINIO_OBJECT_PREFIX:-documents}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1200}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-200}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-indexer_chunks}
      QDRANT_ORIGINAL_VECTOR_NAME: ${QDRANT_ORIGINAL_VECTOR_NAME:-original}
      QDRANT_CONTEXTUAL_VECTOR_NAME: ${QDRANT_CONTEXTUAL_VECTOR_NAME:-contextual}
      QDRANT_HIERARCHY_VECTOR_NAME: ${QDRANT_HIERARCHY_VECTOR_NAME:-hierarchy}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-30}
      KEYWORD_SCROLL_BATCH_SIZE: ${KEYWORD_SCROLL_BATCH_SIZE:-256}
      KEYWORD_BM25_K1: ${KEYWORD_BM25_K1:-1.5}
      KEYWORD_BM25_B: ${KEYWORD_BM25_B:-0.75}
      KEYWORD_CACHE_TTL_SECONDS: ${KEYWORD_CACHE_TTL_SECONDS:-30}
      CONTEXTUALIZATION_ENABLED: ${CONTEXTUALIZATION_ENABLED:-true}
      CONTEXTUALIZATION_FAIL_OPEN: ${CONTEXTUALIZATION_FAIL_OPEN:-false}
      CONTEXTUALIZATION_MODEL: ${CONTEXTUALIZATION_MODEL:-llama3.2:3b}
      CONTEXTUALIZATION_NEIGHBOR_CHUNK_COUNT: ${CONTEXTUALIZATION_NEIGHBOR_CHUNK_COUNT:-2}
      CONTEXTUALIZATION_MAX_NEIGHBOR_CHARS: ${CONTEXTUALIZATION_MAX_NEIGHBOR_CHARS:-6000}
      CONTEXTUALIZATION_MAX_CONTEXT_CHARS: ${CONTEXTUALIZATION_MAX_CONTEXT_CHARS:-400}
      CONTEXTUALIZATION_MAX_CONCURRENCY: ${CONTEXTUALIZATION_MAX_CONCURRENCY:-2}
      CONTEXTUALIZATION_CLUSTER_TARGET_SIZE: ${CONTEXTUALIZATION_CLUSTER_TARGET_SIZE:-8}
      CONTEXTUALIZATION_MAX_CLUSTERS: ${CONTEXTUALIZATION_MAX_CLUSTERS:-24}
      CONTEXTUALIZATION_MAX_CLUSTER_SOURCE_CHARS: ${CONTEXTUALIZATION_MAX_CLUSTER_SOURCE_CHARS:-8000}
      CONTEXTUALIZATION_MAX_DOCUMENT_SOURCE_CHARS: ${CONTEXTUALIZATION_MAX_DOCUMENT_SOURCE_CHARS:-12000}
      CONTEXTUALIZATION_MAX_CLUSTER_SUMMARY_CHARS: ${CONTEXTUALIZATION_MAX_CLUSTER_SUMMARY_CHARS:-600}
      CONTEXTUALIZATION_MAX_DOCUMENT_SUMMARY_CHARS: ${CONTEXTUALIZATION_MAX_DOCUMENT_SUMMARY_CHARS:-900}
      HIERARCHICAL_INDEXING_ENABLED: ${HIERARCHICAL_INDEXING_ENABLED:-true}
      HIERARCHICAL_INDEXING_FAIL_OPEN: ${HIERARCHICAL_INDEXING_FAIL_OPEN:-false}
      HIERARCHICAL_DOCUMENT_CANDIDATES: ${HIERARCHICAL_DOCUMENT_CANDIDATES:-8}
      HIERARCHICAL_SECTION_CANDIDATES: ${HIERARCHICAL_SECTION_CANDIDATES:-24}
      HIERARCHICAL_CHUNK_CANDIDATE_MULTIPLIER: ${HIERARCHICAL_CHUNK_CANDIDATE_MULTIPLIER:-4}
      HIERARCHICAL_MAX_CHUNK_CANDIDATES: ${HIERARCHICAL_MAX_CHUNK_CANDIDATES:-80}
      HYBRID_CANDIDATE_MULTIPLIER: ${HYBRID_CANDIDATE_MULTIPLIER:-4}
      HYBRID_MAX_CANDIDATES: ${HYBRID_MAX_CANDIDATES:-100}
      HYBRID_RRF_K: ${HYBRID_RRF_K:-60}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-1.0}
      HYBRID_KEYWORD_WEIGHT: ${HYBRID_KEYWORD_WEIGHT:-1.0}
      MULTI_QUERY_VARIANT_COUNT: ${MULTI_QUERY_VARIANT_COUNT:-3}
      MULTI_QUERY_INCLUDE_ORIGINAL: ${MULTI_QUERY_INCLUDE_ORIGINAL:-true}
      MULTI_QUERY_CANDIDATE_MULTIPLIER: ${MULTI_QUERY_CANDIDATE_MULTIPLIER:-2}
      MULTI_QUERY_MAX_CANDIDATES_PER_QUERY: ${MULTI_QUERY_MAX_CANDIDATES_PER_QUERY:-20}
      MULTI_QUERY_RRF_K: ${MULTI_QUERY_RRF_K:-60}
      MULTI_QUERY_ORIGINAL_QUERY_WEIGHT: ${MULTI_QUERY_ORIGINAL_QUERY_WEIGHT:-1.2}
      MULTI_QUERY_VARIANT_QUERY_WEIGHT: ${MULTI_QUERY_VARIANT_QUERY_WEIGHT:-1.0}
      MULTI_QUERY_MAX_VARIANT_CHARS: ${MULTI_QUERY_MAX_VARIANT_CHARS:-300}
      MULTI_QUERY_FAIL_OPEN: ${MULTI_QUERY_FAIL_OPEN:-true}
      RERANK_CANDIDATE_MULTIPLIER: ${RERANK_CANDIDATE_MULTIPLIER:-4}
      RERANK_MAX_CANDIDATES: ${RERANK_MAX_CANDIDATES:-40}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      RERANK_MAX_CHARS_PER_CANDIDATE: ${RERANK_MAX_CHARS_PER_CANDIDATE:-4000}
      OLLAMA_RERANK_MAX_ATTEMPTS: ${OLLAMA_RERANK_MAX_ATTEMPTS:-2}
      OLLAMA_RERANK_FALLBACK_TO_ORIGINAL_RANK: ${OLLAMA_RERANK_FALLBACK_TO_ORIGINAL_RANK:-true}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      CROSS_ENCODER_MODEL_REVISION: ${CROSS_ENCODER_MODEL_REVISION:-c5ee24cb16019beea0893ab7796b1df96625c6b8}
      CROSS_ENCODER_MODEL_PATH: ${CROSS_ENCODER_MODEL_PATH:-/root/.cache/huggingface/indexer/cross-encoder}
      CROSS_ENCODER_LOCAL_FILES_ONLY: ${CROSS_ENCODER_LOCAL_FILES_ONLY:-true}
      CROSS_ENCODER_BATCH_SIZE: ${CROSS_ENCODER_BATCH_SIZE:-16}
      CROSS_ENCODER_MAX_LENGTH: ${CROSS_ENCODER_MAX_LENGTH:-512}
      CROSS_ENCODER_DEVICE: ${CROSS_ENCODER_DEVICE:-cpu}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-768}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./datasets:/app/datasets:ro
      - ./reports:/app/reports
      - cross_encoder_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      cross-encoder-bootstrap:
        condition: service_completed_successfully
      # ollama:
      #   condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: indexer-core-web:${IMAGE_TAG:-local}
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${WEB_MAX_UPLOAD_SIZE:-250m}
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-indexer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-indexer_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indexer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexer_password}
      POSTGRES_DB: ${POSTGRES_DB:-indexer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indexer} -d ${POSTGRES_DB:-indexer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  minio_data:
  cross_encoder_cache:
